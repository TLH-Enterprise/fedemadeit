media:
  - name: portfolio-photos
    label: Fotos del portafolio
    input: src/assets/portfolio
    output: /src/assets/portfolio
    categories: [image]
    extensions: [webp, jpg, jpeg, png]

  - name: profile-photo
    label: Foto de perfil
    input: src/assets/hero
    output: /src/assets/hero
    categories: [image]
    extensions: [webp, jpg, jpeg, png]

content:
  - name: hero
    label: Header / Inicio
    type: file
    path: src/data/hero.json
    fields:
      - name: videoUrl
        label: Video de fondo (YouTube)
        description: Link completo de YouTube para el video de fondo del header. Se reproduce en loop y sin sonido por defecto; el visitante puede activar el audio con el botón del header.
        type: string

  - name: about
    label: Sobre mí
    type: file
    path: src/data/about.json
    fields:
      - name: image
        label: Foto de perfil
        description: Foto que se muestra en la página "Sobre mí".
        type: image
        options:
          media: profile-photo

  - name: featured
    label: Destacados (Inicio)
    type: file
    path: src/data/featured.json
    fields:
      - name: items
        label: Fotos destacadas
        description: Sube y ordena las 3 fotos que se muestran en la portada, cada una con su título.
        type: object
        list:
          min: 3
          max: 3
          collapsible:
            summary: "{title}"
        fields:
          - name: title
            label: Título
            type: string
          - name: image
            label: Foto
            type: image
            options:
              media: portfolio-photos

  - name: portfolio
    label: Portafolio
    type: collection
    path: src/content/portfolio
    filename:
      template: "{fields.session}-{primary}"
      field: create
    view:
      fields: [title, type, session]
      primary: title
      sort: [title, session, type]
      search: [title]
    fields:
      - name: title
        label: Título
        type: string
        description: Nombre corto del trabajo (ej. "Llados Fitness")

      - name: type
        label: Tipo
        type: select
        options:
          values:
            - { name: photo, label: "Foto" }
            - { name: video, label: "Video" }

      - name: session
        label: Categoría
        type: select
        options:
          values:
            - { name: eventos-corporativos, label: "Eventos Corporativos" }
            - { name: eventos-sociales, label: "Eventos sociales" }
            - { name: moda-marcas, label: "Moda y marcas" }
            - { name: djs-videos-musicales, label: "Djs y Videos Musicales" }
            - { name: contenido-marca, label: "Contenido de marca" }
            - { name: edicion-videos, label: "Edición de videos" }

      - name: imageAsset
        label: Foto
        description: Solo si Tipo = Foto. Sube la imagen dentro de la subcarpeta de la categoría correspondiente.
        type: image
        required: false
        options:
          media: portfolio-photos

      - name: videoUrl
        label: Link de YouTube
        description: Solo si Tipo = Video. Pega el link completo de YouTube (normal o Shorts).
        type: string
        required: false

      - name: thumbnail
        label: Miniatura del video (avanzado)
        description: Opcional. Solo para videos que NO son de YouTube (ej. un mp4 con URL directa).
        type: image
        required: false
        options:
          media: portfolio-photos
